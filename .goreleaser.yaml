version: 2
project_name: autopus-adk

builds:
  - id: auto
    binary: auto
    main: ./cmd/auto
    flags:
      - -trimpath
      - -buildvcs=false
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=go1.26.9
      - GOENV=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/insajin/autopus-adk/pkg/version.version={{.Version}}
      - -X github.com/insajin/autopus-adk/pkg/version.commit={{.ShortCommit}}
      - -X github.com/insajin/autopus-adk/pkg/version.date={{.CommitDate}}
      - -X github.com/insajin/autopus-adk/pkg/version.sourceCommit={{.Env.COMPANION_SOURCE_COMMIT}}
      - -X github.com/insajin/autopus-adk/pkg/version.sourceTree={{.Env.COMPANION_SOURCE_TREE}}
      - -X github.com/insajin/autopus-adk/internal/cli.pipelineOMPActiveStaticPolicyB64={{.Env.OMP_CONTEXT_STATIC_POLICY_B64}}
    hooks:
      post:
        # Compare reproducible policy-bearing bytes before Developer ID signing.
        - cmd: scripts/companion-release/verify-omp-context-release-binary.sh
          env:
            - COMPANION_ARTIFACT={{ .Path }}
            - COMPANION_PLATFORM={{ .Os }}
            - COMPANION_ARCHITECTURE={{ .Arch }}
            - COMPANION_RELEASE_TAG={{ .Env.GITHUB_REF_NAME }}
            - OMP_CONTEXT_CANDIDATE_ARTIFACT_SHA256={{ .Env.OMP_CONTEXT_CANDIDATE_ARTIFACT_SHA256 }}
        - cmd: scripts/companion-release/produce.sh
          env:
            - COMPANION_ARTIFACT={{ .Path }}
            - COMPANION_TARGET={{ .Target }}
            - COMPANION_PLATFORM={{ .Os }}
            - COMPANION_ARCHITECTURE={{ .Arch }}
            - COMPANION_VERSION={{ .Version }}

archives:
  - id: auto
    ids:
      - auto
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
          - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE*
      - src: README*
      - src: CHANGELOG*
      - src: '{{ if eq .Os "darwin" }}dist/auto_{{ .Target }}/adk-companion-manifest.json{{ else }}scripts/companion-release/no-files-*{{ end }}'
        dst: adk-companion-manifest.json
      - src: '{{ if eq .Os "darwin" }}dist/auto_{{ .Target }}/adk-companion-manifest.sig{{ else }}scripts/companion-release/no-files-*{{ end }}'
        dst: adk-companion-manifest.sig
      - src: '{{ if eq .Os "darwin" }}dist/auto_{{ .Target }}/adk-companion-darwin-receipt.json{{ else }}scripts/companion-release/no-files-*{{ end }}'
        dst: adk-companion-darwin-receipt.json
      - src: '{{ if eq .Os "darwin" }}dist/auto_{{ .Target }}/adk-companion-public-key-receipt.bundle/**{{ else }}scripts/companion-release/no-files-*{{ end }}'
        dst: adk-companion-public-key-receipt.bundle
        strip_parent: true
      - src: '{{ if and (eq .Os "darwin") (eq .Arch "arm64") }}dist/auto_{{ .Target }}/release-lineage-v1.json{{ else }}scripts/companion-release/no-files-*{{ end }}'
        dst: release-lineage-v1.json
      - src: '{{ if and (eq .Os "darwin") (eq .Arch "arm64") }}dist/auto_{{ .Target }}/release-lineage-v1.sig{{ else }}scripts/companion-release/no-files-*{{ end }}'
        dst: release-lineage-v1.sig

release:
  replace_existing_artifacts: false
  target_commitish: "{{ .Env.COMPANION_SOURCE_COMMIT }}"
  use_existing_draft: true
  # Publish the operator-reserved empty draft and replace only its machine
  # reservation body with generated release notes.
  mode: replace
  extra_files:
    - glob: "{{ .Env.OMP_CONTEXT_PROMOTION_REPORT_PATH }}"
    - glob: "{{ .Env.OMP_CONTEXT_PROMOTION_ATTESTATION_PATH }}"
    - glob: "{{ .Env.OMP_CONTEXT_RELEASE_LINEAGE_PATH }}"
    - glob: "{{ .Env.OMP_CONTEXT_RELEASE_LINEAGE_SIGNATURE_PATH }}"

checksum:
  name_template: 'checksums.txt'

signs:
  - cmd: cosign
    artifacts: checksum
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    signature: "${artifact}.bundle"
    output: true
    env:
      - COSIGN_EXPERIMENTAL=1
  # Versioned multi-signature envelope over checksums.txt. The helper derives
  # each P-256 key's full SPKI SHA-256 fingerprint and sorts records so a
  # future K1+K2 overlap does not depend on argument order.
  - id: ecdsa-release-envelope
    cmd: scripts/release-signing/sign-checksums.sh
    artifacts: checksum
    args:
      - "${artifact}"
      - "${signature}"
      - "{{ .Env.ADK_RELEASE_ECDSA_PRIVATE_KEY_FILE }}"
    signature: "${artifact}.signatures"
    output: true


changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

homebrew_casks:
  - name: auto
    # GoReleaser renders the canonical Cask, but publication is reconciled with
    # the legacy Formula only after the GitHub release is immutable.
    skip_upload: true
    ids:
      - auto
    repository:
      owner: Insajin
      name: homebrew-autopus
      branch: main
    directory: Casks
    # The canonical Cask renderer and every published Cask use the pre-transfer
    # owner; its release asset URLs redirect to autopus-ai. Without an explicit
    # template GoReleaser derives the owner from the release repository, so the
    # Cask it renders stopped matching the renderer after the transfer and the
    # publish step failed on every release.
    url:
      template: "https://github.com/Insajin/autopus-adk/releases/download/{{ urlPathEscape .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/Insajin/autopus-adk"
    description: "Agentic Development Kit for coding CLIs (the auto CLI)"
    license: "MIT"
    commit_author:
      name: autopus-release-bot
      email: noreply@autopus.co
    binaries:
      - auto
