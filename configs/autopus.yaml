# autopus.yaml — Autopus-ADK 기본 설정
# 'auto init' 명령어로 자동 생성되는 기본 Full 모드 설정입니다.

mode: full
project_name: my-project
platforms:
  - claude-code

architecture:
  auto_generate: true
  enforce: true
  layers:
    - cmd
    - internal
    - pkg
    - domain
    - infrastructure

lore:
  enabled: true
  auto_inject: true
  required_trailers:
    - Why
    - Decision
  stale_threshold_days: 90

spec:
  id_format: "SPEC-{NAME}-{NUMBER}"
  ears_types:
    - ubiquitous
    - event_driven
    - unwanted_behavior
    - state_driven
    - optional

methodology:
  mode: tdd
  enforce: true
  review_gate: true

hooks:
  pre_commit_arch: true
  pre_commit_lore: true
  react_ci_failure: true
  react_review: true

session:
  handoff_enabled: true
  continue_file: .auto-continue.md
  max_context_tokens: 2000

orchestra:
  enabled: true
  default_strategy: consensus
  timeout_seconds: 240
  providers:
    claude:
      binary: claude
      args: ["--print", "--model", "claude-fable-5-1", "--effort", "max"]
      subprocess:
        timeout: 480
    codex:
      binary: codex
      args: ["exec", "--json", "--sandbox", "workspace-write", "-m", "gpt-6-astra", "-c", 'model_reasoning_effort="max"']
      model_policy: quality
    gemini:
      binary: agy
      args: ["--print", ""]
      prompt_via_args: true
      subprocess:
        output_format: text
  commands:
    plan:
      strategy: consensus
      providers: [claude, codex, gemini]
    review:
      strategy: debate
      providers: [claude, codex, gemini]
    secure:
      strategy: consensus
      providers: [claude, codex, gemini]
    brainstorm:
      strategy: debate
      providers: [claude, codex, gemini]

quality:
  default: balanced
  # Optional independent overrides:
  # providers:
  #   claude: ultra
  #   codex: balanced
  supervisor_model_policy: inherit
