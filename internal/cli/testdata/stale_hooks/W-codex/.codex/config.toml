# Codex configuration (auto-generated by Autopus-ADK)
# Project: W-codex


model_reasoning_summary = "auto"
model_verbosity = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
project_doc_max_bytes = 262144

[features]
goals = true
hooks = true
shell_tool = true
