name: PR
on:
  pull_request:
jobs:
  build:
    runs-on: [self-hosted, macOS, heavy]
    steps:
      - uses: actions/checkout@v4
      - run: make test
  fork-guarded:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - run: make e2e
  reuse:
    uses: ./.github/workflows/release.yml
