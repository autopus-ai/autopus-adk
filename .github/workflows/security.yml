name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check, so it is
# cancelled. Every other event gets a group of its own run id: main pushes,
# the weekly schedule, and the release workflow that calls this file through
# workflow_call are never cancelled or queued behind another run. The literal
# prefix keeps the group apart from the caller's, which shares github.workflow
# and github.run_id when this file runs as a reusable workflow.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # `gitleaks-action` is free for a personal account and licensed for an
      # organization. Moving this repository to `autopus-ai` crossed that line,
      # and the job has failed with "missing gitleaks license" on every run
      # since -- success on 2026-09-10, failure from 2026-09-14. The scanner
      # itself is MIT, so invoking the binary keeps the scan and drops the
      # licence. `backend-quality.yml` in the sibling repository already does
      # this.
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # Whole history, not `--log-opts=<base>..<head>`. A range scan sees only
      # what the branch adds, so anything already on main stays unscanned, and
      # a squash merge rewrites the commits a range-scoped fingerprint names --
      # the ignore entry a pull request adds stops matching the moment it lands.
      - name: Run Gitleaks
        run: |
          "$(go env GOPATH)/bin/gitleaks" git \
            --config=.gitleaks.toml \
            --redact=100 \
            --no-banner \
            --verbose \
            .

  govulncheck:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # Track the repo toolchain instead of duplicating it here: a pinned
          # copy meant a toolchain bump never reached the scanner, so stdlib
          # advisories kept failing this job after go.mod was already fixed.
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        run: govulncheck ./...
