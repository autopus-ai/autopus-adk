name: Recover Homebrew Formula Bridge

on:
  workflow_dispatch: {}

# Canonical post-release recovery:
# gh workflow run homebrew-formula-bridge-recovery.yaml --ref v0.50.118
#
# The checked-out tag owns every verifier and the Cask publisher. This job may
# retry only the tap CAS after the exact immutable release and its historical K3
# proof have been verified. It cannot repair a bad tag, release, or evidence set.
permissions:
  contents: read

jobs:
  recover-formula-bridge:
    if: github.ref == 'refs/tags/v0.50.118'
    environment:
      name: adk-companion-release
    permissions:
      contents: read
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out exact A29 release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Select Homebrew OpenSSL 3
        shell: bash
        run: |
          set -euo pipefail
          openssl_prefix=$(brew --prefix openssl@3)
          [[ -n "$openssl_prefix" ]]
          openssl_bin="$openssl_prefix/bin"
          [[ -x "$openssl_bin/openssl" ]]
          openssl_version=$("$openssl_bin/openssl" version)
          [[ "$openssl_version" == "OpenSSL 3."* ]]
          printf '%s\n' "$openssl_bin" >> "$GITHUB_PATH"

      - name: Build trusted current-release verifiers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence_verifier="$RUNNER_TEMP/auto-omp-context-evidence-verifier"
          lineage_verifier="$RUNNER_TEMP/auto-omp-context-lineage-verifier"
          manifest_verifier="$RUNNER_TEMP/auto-companion-manifest-verifier"
          [[ ! -e "$evidence_verifier" && ! -L "$evidence_verifier" &&
             ! -e "$lineage_verifier" && ! -L "$lineage_verifier" &&
             ! -e "$manifest_verifier" && ! -L "$manifest_verifier" ]]
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$evidence_verifier" \
            ./scripts/companion-release/ompcontextverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$lineage_verifier" \
            ./scripts/companion-release/ompcontextlineageverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$manifest_verifier" \
            ./scripts/companion-release/manifestverify
          chmod 0700 "$evidence_verifier" "$lineage_verifier" "$manifest_verifier"
          for verifier in "$evidence_verifier" "$lineage_verifier" "$manifest_verifier"; do
            [[ -f "$verifier" && ! -L "$verifier" && -x "$verifier" ]]
            [[ "$(stat -f '%Lp' "$verifier")" == '700' ]]
          done

      - name: Validate exact R2-signed recovery source
        id: release-source
        shell: bash
        env:
          COMPANION_APPROVED_SOURCE_COMMIT: ${{ vars.ADK_COMPANION_APPROVED_SOURCE_COMMIT }}
          COMPANION_APPROVED_SOURCE_TREE: ${{ vars.ADK_COMPANION_APPROVED_SOURCE_TREE }}
        run: |
          set -euo pipefail
          umask 077
          actual_head=$(git rev-parse --verify 'HEAD^{commit}')
          [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]]
          validation_output=$(mktemp "$RUNNER_TEMP/formula-recovery-source.XXXXXX")
          trap 'rm -f -- "$validation_output"' EXIT
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            GITHUB_REF_NAME="$GITHUB_REF_NAME" GITHUB_REF_TYPE='tag' \
            GITHUB_SHA="$actual_head" GITHUB_OUTPUT="$validation_output" \
            COMPANION_RELEASE_TAG_SIGNATURE_REQUIRED=1 COMPANION_SOURCE_PIN_REQUIRED=1 \
            COMPANION_APPROVED_SOURCE_COMMIT="$COMPANION_APPROVED_SOURCE_COMMIT" \
            COMPANION_APPROVED_SOURCE_TREE="$COMPANION_APPROVED_SOURCE_TREE" \
            scripts/companion-release/validate-source.sh
          [[ "$(grep -Ec '^source-commit=[0-9a-f]{40}$' "$validation_output")" == '1' ]]
          [[ "$(grep -Ec '^source-tree=[0-9a-f]{40}$' "$validation_output")" == '1' ]]
          source_commit=$(sed -n 's/^source-commit=//p' "$validation_output")
          source_tree=$(sed -n 's/^source-tree=//p' "$validation_output")
          [[ "$source_commit" == "$actual_head" && "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'source-commit=%s\nsource-tree=%s\n' "$source_commit" "$source_tree" >> "$GITHUB_OUTPUT"

      - name: Verify exact sealed release-tag authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_TOKEN="$GITHUB_TOKEN" \
            scripts/companion-release/verify-release-tag-ruleset.sh --sealed-runtime

      - name: Verify exact immutable release and historical K3 proof
        id: release-evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANION_SOURCE_COMMIT: ${{ steps.release-source.outputs.source-commit }}
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          OMP_CONTEXT_EVIDENCE_REPORT_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_REPORT_SHA256 }}
          OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256 }}
          OMP_CONTEXT_STATIC_POLICY_B64: ${{ vars.OMP_CONTEXT_STATIC_POLICY_B64 }}
          COMPANION_KEY_ID: ${{ vars.ADK_COMPANION_KEY_ID }}
          COMPANION_HANDOFF: v1
          COMPANION_ROLLBACK_FLOOR: ${{ vars.ADK_COMPANION_ROLLBACK_FLOOR }}
          COMPANION_PUBLIC_KEY_SHA256: ${{ vars.ADK_COMPANION_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          release_id=$(env -i PATH="$PATH" HOME="$HOME" GITHUB_TOKEN="$GITHUB_TOKEN" \
            gh api "repos/autopus-ai/autopus-adk/releases/tags/$GITHUB_REF_NAME" | \
            jq -er '.id | select(type == "number" and . > 0)')
          checksums_path="$RUNNER_TEMP/autopus-$GITHUB_REF_NAME-checksums.txt"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            GITHUB_TOKEN="$GITHUB_TOKEN" COMPANION_RELEASE_ID="$release_id" \
            COMPANION_SOURCE_COMMIT="$COMPANION_SOURCE_COMMIT" \
            COMPANION_SOURCE_TREE="$COMPANION_SOURCE_TREE" \
            OMP_CONTEXT_EVIDENCE_REPORT_SHA256="$OMP_CONTEXT_EVIDENCE_REPORT_SHA256" \
            OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256="$OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256" \
            OMP_CONTEXT_STATIC_POLICY_B64="$OMP_CONTEXT_STATIC_POLICY_B64" \
            OMP_CONTEXT_EVIDENCE_VERIFIER="$RUNNER_TEMP/auto-omp-context-evidence-verifier" \
            OMP_CONTEXT_LINEAGE_VERIFIER="$RUNNER_TEMP/auto-omp-context-lineage-verifier" \
            COMPANION_MANIFEST_VERIFIER="$RUNNER_TEMP/auto-companion-manifest-verifier" \
            COMPANION_KEY_ID="$COMPANION_KEY_ID" COMPANION_HANDOFF="$COMPANION_HANDOFF" \
            COMPANION_ROLLBACK_FLOOR="$COMPANION_ROLLBACK_FLOOR" \
            COMPANION_PUBLIC_KEY_SHA256="$COMPANION_PUBLIC_KEY_SHA256" \
            scripts/companion-release/verify-current-release.sh "$checksums_path"
          printf 'checksums-path=%s\n' "$checksums_path" >> "$GITHUB_OUTPUT"

      - name: Create Homebrew tap token
        id: homebrew-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: Insajin
          repositories: homebrew-autopus
          permission-contents: write

      - name: Reconcile Homebrew Cask
        shell: bash
        env:
          COMPANION_CHECKSUMS_PATH: ${{ steps.release-evidence.outputs.checksums-path }}
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-app-token.outputs.token }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            COMPANION_VERSION="${GITHUB_REF_NAME#v}" \
            COMPANION_HOMEBREW_POLICY='cask-only' \
            COMPANION_CHECKSUMS_PATH="$COMPANION_CHECKSUMS_PATH" \
            HOMEBREW_TAP_TOKEN="$HOMEBREW_TAP_TOKEN" \
            scripts/companion-release/publish-homebrew-formula-bridge.sh

      - name: Remove downloaded release evidence
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/autopus-$GITHUB_REF_NAME-checksums.txt"
