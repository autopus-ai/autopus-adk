name: Upgrade Canary

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  public-asset-admission:
    name: public-asset-admission
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Admit exact public signed A46 to A47 upgrade
        shell: bash
        env:
          UPGRADE_CANARY_RECEIPT_DIR: ${{ runner.temp }}/upgrade-canary-live-receipt
          UPGRADE_CANARY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/release-signing/tests/posix-upgrade-canary.sh live 0.51.5 0.51.6
          jq -e '
            .mode == "live" and .status == "admitted" and
            .proof == "public asset admission" and
            .previous_public_version == "0.51.5" and
            .candidate_public_version == "0.51.6" and
            .actual_release_executables_verified == true and
            .public_signed_installers_verified == true
          ' "$UPGRADE_CANARY_RECEIPT_DIR/provenance.json" >/dev/null

      - name: Bind public release and workflow provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_DIR: ${{ runner.temp }}/upgrade-canary-live-receipt
        run: |
          set -euo pipefail
          previous_release=$(gh api 'repos/autopus-ai/autopus-adk/releases/441700303')
          previous_ref=$(gh api 'repos/autopus-ai/autopus-adk/git/ref/tags/v0.51.5')
          previous_tag=$(gh api 'repos/autopus-ai/autopus-adk/git/tags/12941460a548c4bf09014a1c2486937121c14d7a')
          previous_commit=$(gh api 'repos/autopus-ai/autopus-adk/commits/8ab8b182c425ab8a68112293e8ab272ff3765dcb')
          jq -e '
            .id == 441700303 and .tag_name == "v0.51.5" and
            .target_commitish == "8ab8b182c425ab8a68112293e8ab272ff3765dcb" and
            .draft == false and .prerelease == false and .immutable == true and
            ([.assets[] | select(.name == "autopus-adk_0.51.5_darwin_arm64.tar.gz" and
              .digest == "sha256:d2d70469de12a18c10057880c2c054ce6221632758633ae44d7393ee02b4f56b")] | length) == 1
          ' <<<"$previous_release" >/dev/null
          jq -e '
            .object.type == "tag" and
            .object.sha == "12941460a548c4bf09014a1c2486937121c14d7a"
          ' <<<"$previous_ref" >/dev/null
          jq -e '
            .sha == "12941460a548c4bf09014a1c2486937121c14d7a" and
            .object.type == "commit" and
            .object.sha == "8ab8b182c425ab8a68112293e8ab272ff3765dcb"
          ' <<<"$previous_tag" >/dev/null
          jq -e '
            .sha == "8ab8b182c425ab8a68112293e8ab272ff3765dcb" and
            .commit.tree.sha == "cc3d28854ecf838a391092162e38d196b955a9c4"
          ' <<<"$previous_commit" >/dev/null

          candidate_release=$(gh api 'repos/autopus-ai/autopus-adk/releases/tags/v0.51.6')
          candidate_ref=$(gh api 'repos/autopus-ai/autopus-adk/git/ref/tags/v0.51.6')
          candidate_commit=$(jq -er '.target_commitish | select(test("^[0-9a-f]{40}$"))' \
            <<<"$candidate_release")
          candidate_commit_json=$(gh api "repos/autopus-ai/autopus-adk/commits/$candidate_commit")
          jq -e '
            .tag_name == "v0.51.6" and .draft == false and
            .prerelease == false and .immutable == true and
            ([.assets[] | select(.name == "autopus-adk_0.51.6_darwin_arm64.tar.gz" and
              (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))] | length) == 1
          ' <<<"$candidate_release" >/dev/null
          candidate_tag_object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' \
            <<<"$candidate_ref")
          [[ "$(jq -er '.object.type' <<<"$candidate_ref")" == 'tag' ]]
          candidate_tag=$(gh api "repos/autopus-ai/autopus-adk/git/tags/$candidate_tag_object")
          jq -e --arg commit "$candidate_commit" '
            .object.type == "commit" and .object.sha == $commit
          ' <<<"$candidate_tag" >/dev/null
          candidate_tree=$(jq -er '.commit.tree.sha | select(test("^[0-9a-f]{40}$"))' \
            <<<"$candidate_commit_json")
          candidate_release_id=$(jq -er '.id | select(type == "number" and . > 0)' \
            <<<"$candidate_release")
          candidate_archive_digest=$(jq -er '
            [.assets[] | select(.name == "autopus-adk_0.51.6_darwin_arm64.tar.gz")][0].digest
          ' <<<"$candidate_release")

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg candidate_commit "$candidate_commit" --arg candidate_tree "$candidate_tree" \
            --arg candidate_tag_object "$candidate_tag_object" \
            --arg candidate_archive_digest "$candidate_archive_digest" \
            --argjson candidate_release_id "$candidate_release_id" \
            '{schema_version:"autopus-upgrade-canary-provenance.v1",repository:$repository,
              workflow_ref:$workflow_ref,workflow_sha:$workflow_sha,run_id:$run_id,
              run_attempt:$run_attempt,previous:{version:"0.51.5",release_id:441700303,
              tag_object:"12941460a548c4bf09014a1c2486937121c14d7a",
              source_commit:"8ab8b182c425ab8a68112293e8ab272ff3765dcb",
              source_tree:"cc3d28854ecf838a391092162e38d196b955a9c4",
              darwin_arm64_digest:"sha256:d2d70469de12a18c10057880c2c054ce6221632758633ae44d7393ee02b4f56b"},
              candidate:{version:"0.51.6",release_id:$candidate_release_id,
              tag_object:$candidate_tag_object,source_commit:$candidate_commit,
              source_tree:$candidate_tree,darwin_arm64_digest:$candidate_archive_digest}}' \
            > "$RECEIPT_DIR/workflow-provenance.json"

      # This receipt is diagnostic workflow output with bounded retention, not a
      # substitute for the immutable public release or its signed assets.
      - name: Upload public asset admission receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-canary-0.51.5-to-0.51.6
          path: ${{ runner.temp }}/upgrade-canary-live-receipt
          if-no-files-found: error
          retention-days: 30
