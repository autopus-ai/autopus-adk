name: Upgrade Canary

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  public-asset-admission:
    name: public-asset-admission
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Admit exact public signed A28 to A29 upgrade
        shell: bash
        env:
          UPGRADE_CANARY_RECEIPT_DIR: ${{ runner.temp }}/upgrade-canary-live-receipt
          UPGRADE_CANARY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/release-signing/tests/posix-upgrade-canary.sh live 0.50.117 0.50.118
          jq -e '
            .mode == "live" and .status == "admitted" and
            .proof == "public asset admission" and
            .previous_public_version == "0.50.117" and
            .candidate_public_version == "0.50.118" and
            .actual_release_executables_verified == true and
            .public_signed_installers_verified == true
          ' "$UPGRADE_CANARY_RECEIPT_DIR/provenance.json" >/dev/null

      - name: Bind public release and workflow provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_DIR: ${{ runner.temp }}/upgrade-canary-live-receipt
        run: |
          set -euo pipefail
          previous_release=$(gh api 'repos/autopus-ai/autopus-adk/releases/383826825')
          previous_ref=$(gh api 'repos/autopus-ai/autopus-adk/git/ref/tags/v0.50.117')
          previous_tag=$(gh api 'repos/autopus-ai/autopus-adk/git/tags/edcd4eb98f4e52e8ff868d1f8440cfa0d0c5bc3a')
          previous_commit=$(gh api 'repos/autopus-ai/autopus-adk/commits/620e29a44d004cb199d5f1c22ae92878f9b6930e')
          jq -e '
            .id == 383826825 and .tag_name == "v0.50.117" and
            .target_commitish == "620e29a44d004cb199d5f1c22ae92878f9b6930e" and
            .draft == false and .prerelease == false and .immutable == true and
            ([.assets[] | select(.name == "autopus-adk_0.50.117_darwin_arm64.tar.gz" and
              .digest == "sha256:3a2dcdf7d0e89ca93dae32f6560b096f3c20903f8a7a7a8407a53f017c50261c")] | length) == 1
          ' <<<"$previous_release" >/dev/null
          jq -e '
            .object.type == "tag" and
            .object.sha == "edcd4eb98f4e52e8ff868d1f8440cfa0d0c5bc3a"
          ' <<<"$previous_ref" >/dev/null
          jq -e '
            .sha == "edcd4eb98f4e52e8ff868d1f8440cfa0d0c5bc3a" and
            .object.type == "commit" and
            .object.sha == "620e29a44d004cb199d5f1c22ae92878f9b6930e"
          ' <<<"$previous_tag" >/dev/null
          jq -e '
            .sha == "620e29a44d004cb199d5f1c22ae92878f9b6930e" and
            .commit.tree.sha == "fce0d047ae8cf5c519762fe4ebf530e7ccc01ed1"
          ' <<<"$previous_commit" >/dev/null

          candidate_release=$(gh api 'repos/autopus-ai/autopus-adk/releases/tags/v0.50.118')
          candidate_ref=$(gh api 'repos/autopus-ai/autopus-adk/git/ref/tags/v0.50.118')
          candidate_commit=$(jq -er '.target_commitish | select(test("^[0-9a-f]{40}$"))' \
            <<<"$candidate_release")
          candidate_commit_json=$(gh api "repos/autopus-ai/autopus-adk/commits/$candidate_commit")
          jq -e '
            .tag_name == "v0.50.118" and .draft == false and
            .prerelease == false and .immutable == true and
            ([.assets[] | select(.name == "autopus-adk_0.50.118_darwin_arm64.tar.gz" and
              (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))] | length) == 1
          ' <<<"$candidate_release" >/dev/null
          candidate_tag_object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' \
            <<<"$candidate_ref")
          [[ "$(jq -er '.object.type' <<<"$candidate_ref")" == 'tag' ]]
          candidate_tag=$(gh api "repos/autopus-ai/autopus-adk/git/tags/$candidate_tag_object")
          jq -e --arg commit "$candidate_commit" '
            .object.type == "commit" and .object.sha == $commit
          ' <<<"$candidate_tag" >/dev/null
          candidate_tree=$(jq -er '.commit.tree.sha | select(test("^[0-9a-f]{40}$"))' \
            <<<"$candidate_commit_json")
          candidate_release_id=$(jq -er '.id | select(type == "number" and . > 0)' \
            <<<"$candidate_release")
          candidate_archive_digest=$(jq -er '
            [.assets[] | select(.name == "autopus-adk_0.50.118_darwin_arm64.tar.gz")][0].digest
          ' <<<"$candidate_release")

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg candidate_commit "$candidate_commit" --arg candidate_tree "$candidate_tree" \
            --arg candidate_tag_object "$candidate_tag_object" \
            --arg candidate_archive_digest "$candidate_archive_digest" \
            --argjson candidate_release_id "$candidate_release_id" \
            '{schema_version:"autopus-upgrade-canary-provenance.v1",repository:$repository,
              workflow_ref:$workflow_ref,workflow_sha:$workflow_sha,run_id:$run_id,
              run_attempt:$run_attempt,previous:{version:"0.50.117",release_id:383826825,
              tag_object:"edcd4eb98f4e52e8ff868d1f8440cfa0d0c5bc3a",
              source_commit:"620e29a44d004cb199d5f1c22ae92878f9b6930e",
              source_tree:"fce0d047ae8cf5c519762fe4ebf530e7ccc01ed1",
              darwin_arm64_digest:"sha256:3a2dcdf7d0e89ca93dae32f6560b096f3c20903f8a7a7a8407a53f017c50261c"},
              candidate:{version:"0.50.118",release_id:$candidate_release_id,
              tag_object:$candidate_tag_object,source_commit:$candidate_commit,
              source_tree:$candidate_tree,darwin_arm64_digest:$candidate_archive_digest}}' \
            > "$RECEIPT_DIR/workflow-provenance.json"

      # This receipt is diagnostic workflow output with bounded retention, not a
      # substitute for the immutable public release or its signed assets.
      - name: Upload public asset admission receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-canary-0.50.117-to-0.50.118
          path: ${{ runner.temp }}/upgrade-canary-live-receipt
          if-no-files-found: error
          retention-days: 30
