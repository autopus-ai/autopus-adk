name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test harness benchmark contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/benchmarks/harness -p 'test_*.py'

      # Compile-check every goreleaser target OS so platform-specific syscall
      # usage is caught here instead of failing the release job at tag time.
      - name: Cross-compile release targets
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...

      # 프로세스 중량 테스트 목록은 Makefile 의 PROCESS_HEAVY_TESTS 가 단일
      # 출처다. CI 가 정규식을 복사해 두면 로컬 게이트와 CI 게이트가 조용히
      # 갈라지므로, 값을 그대로 읽어 오고 파싱 실패는 즉시 에러로 만든다.
      - name: Resolve process-heavy test selector
        shell: bash
        run: |
          set -euo pipefail
          selector="$(sed -n 's/^PROCESS_HEAVY_TESTS ?= //p' Makefile)"
          [[ -n "$selector" ]]
          printf 'PROCESS_HEAVY_TESTS=%s\n' "$selector" >> "$GITHUB_ENV"

      # @AX:REASON [AUTO]: Keep every process-heavy fixture off the shared Go package scheduler while preserving its race gate.
      - name: Test process-heavy contracts in isolation
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(go test -list '^TestReleaseHardeningBashContract$' ./internal/companionmanifest)"
          count="$(
            printf '%s\n' "$inventory" |
              awk '$0 == "TestReleaseHardeningBashContract" { found++ } END { print found + 0 }'
          )"
          [[ "$count" == 1 ]]
          [[ "$PROCESS_HEAVY_TESTS" == *'TestReleaseHardeningBashContract'* ]]
          go test -race -count=1 -timeout=10m -p 1 \
            -run "$PROCESS_HEAVY_TESTS" \
            -coverprofile=coverage-isolated.out ./...

      # 공유 레인은 격리 레인과 정확히 같은 집합을 건너뛴다. 건너뛴 테스트의
      # 커버리지는 격리 레인이 남긴 프로파일에 그대로 있으므로 두 프로파일을
      # 합쳐 총계를 유지한다 - 임계값은 건드리지 않는다.
      - name: Test with Coverage
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=20m \
            -skip "$PROCESS_HEAVY_TESTS" \
            -coverprofile=coverage-shared.out ./...
          mode="$(head -n 1 coverage-shared.out)"
          [[ "$mode" == "$(head -n 1 coverage-isolated.out)" ]]
          {
            printf '%s\n' "$mode"
            tail -n +2 coverage-shared.out
            tail -n +2 coverage-isolated.out
          } > coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=${COVERAGE_THRESHOLD:-85}
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
        env:
          COVERAGE_THRESHOLD: "85"

      - name: Vet
        run: go vet ./...

  lineage-integration:
    name: lineage-integration
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # @AX:REASON [AUTO]: Keep the bounded GoReleaser warm-up off the shared package scheduler so its 30-minute budget is deterministic.
      - name: Test non-lineage integration packages
        shell: bash
        run: |
          set -euo pipefail
          lineage_package="$(go list -tags integration ./pkg/companionmanifest)"
          all_packages="$(go list -tags integration ./...)"
          packages=()
          lineage_matches=0
          while IFS= read -r package; do
            if [[ "$package" == "$lineage_package" ]]; then
              lineage_matches=$((lineage_matches + 1))
            else
              packages+=("$package")
            fi
          done <<<"$all_packages"
          ((lineage_matches == 1))
          ((${#packages[@]} > 0))
          go test -count=1 -timeout=15m -tags integration "${packages[@]}"

      - name: Test release lineage integration
        run: >-
          go test -count=1 -timeout=30m -tags integration
          ./pkg/companionmanifest

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build Binary
        run: make build
      - name: Run E2E Tests
        run: make test-e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          args: --timeout=5m

  static-contracts:
    name: static-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "v2.17.0"
          args: check

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

  omp-native-smoke:
    name: omp-native-smoke
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run pinned OMP native task hub and rule delivery smokes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(uname -s)" == 'Darwin' ]]
          [[ "$(uname -m)" == 'arm64' ]]
          omp_binary="${RUNNER_TEMP}/omp-v17.2.7-darwin-arm64"
          omp_bin_dir="${RUNNER_TEMP}/omp-path-shim"
          [[ ! -e "$omp_binary" && ! -L "$omp_binary" ]]
          [[ ! -e "$omp_bin_dir" && ! -L "$omp_bin_dir" ]]
          cleanup_omp() {
            rm -rf -- "$omp_bin_dir"
            rm -f -- "$omp_binary"
          }
          trap cleanup_omp EXIT
          /usr/bin/curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            --output "$omp_binary" \
            'https://github.com/can1357/oh-my-pi/releases/download/v17.2.7/omp-darwin-arm64'
          expected='cd2f47545cb3f8eb5e15c91bc9054d73967774652e020b432e294803d1b71ea0'
          actual=$(/usr/bin/shasum -a 256 "$omp_binary" | /usr/bin/awk '{print $1}')
          [[ "$actual" == "$expected" ]]
          /bin/chmod 0555 "$omp_binary"
          [[ "$("$omp_binary" --version)" == 'omp/17.2.7' ]]
          # `go test -run '^Name$'` exits 0 with "no tests to run" when the
          # selector matches nothing, and both smokes t.Skip themselves when
          # AUTOPUS_OMP_* or the omp binary do not reach them. Either way this
          # job would report a verified live probe having executed nothing, so
          # assert the selector inventory before the run the way the
          # process-heavy selector is asserted above, then require an explicit
          # `--- PASS` for the named test and no skip at all.
          live_smoke() {
            local name="$1" package="$2" log="${RUNNER_TEMP}/${1}.log"
            local listed
            listed="$(go test -list "^${name}\$" "$package" |
              /usr/bin/awk -v want="$name" '$0 == want { found++ } END { print found + 0 }')"
            if [[ "$listed" != 1 ]]; then
              echo "::error::-run '^${name}\$' matches ${listed} test(s) in ${package}; the OMP live smoke selector no longer names a test and the gate would pass having run nothing"
              return 1
            fi
            go test -count=1 -timeout=90s -v -run "^${name}\$" "$package" 2>&1 | tee "$log"
            if ! /usr/bin/grep -q "^--- PASS: ${name} " "$log"; then
              echo "::error::${name} reported no '--- PASS' line in ${package}; the live smoke ran 0 tests"
              return 1
            fi
            if /usr/bin/grep -q '^--- SKIP' "$log"; then
              echo "::error::${name} skipped in ${package}; the pinned omp binary or its AUTOPUS_OMP_* environment never reached the test, and a skipped live smoke proves nothing"
              return 1
            fi
          }
          (
            export AUTOPUS_OMP_NATIVE_LIVE=1
            export AUTOPUS_OMP_LIVE_EXECUTABLE="$omp_binary"
            live_smoke TestOMPNativeTaskHubLiveSmoke ./pkg/adapter/omp
          )
          # The rule-delivery oracle resolves `omp` from PATH, so publish the same
          # verified binary under its plain name instead of downloading it twice.
          /bin/mkdir -m 0755 "$omp_bin_dir"
          /bin/ln -s "$omp_binary" "$omp_bin_dir/omp"
          (
            export AUTOPUS_OMP_RULES_LIVE=1
            export PATH="$omp_bin_dir:$PATH"
            live_smoke TestOMPRules_LiveSessionReceivesEverySourceRule ./pkg/adapter/omp
          )

  macos-runtime:
    name: macos-runtime
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build host-native unsigned macOS runtime smoke binary
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          go_arch="$(go env GOARCH)"
          case "${host_arch}:${go_arch}" in
            arm64:arm64|x86_64:amd64) ;;
            *)
              echo "::error::Host architecture ${host_arch} does not match Go architecture ${go_arch}"
              exit 1
              ;;
          esac

          runtime_version="ci-${GITHUB_SHA:0:12}"
          runtime_commit="${GITHUB_SHA:0:12}"
          runtime_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          runtime_binary="${RUNNER_TEMP}/auto-runtime-smoke"
          go build -trimpath \
            -ldflags "-s -w -X github.com/insajin/autopus-adk/pkg/version.version=${runtime_version} -X github.com/insajin/autopus-adk/pkg/version.commit=${runtime_commit} -X github.com/insajin/autopus-adk/pkg/version.date=${runtime_date}" \
            -o "$runtime_binary" ./cmd/auto
          {
            echo "AUTOPUS_CI_RUNTIME_BINARY=${runtime_binary}"
            echo "AUTOPUS_CI_RUNTIME_VERSION=${runtime_version}"
          } >> "$GITHUB_ENV"

      - name: Smoke host-native unsigned macOS command admission
        shell: bash
        run: |
          # This source-built smoke does not replace the Developer ID signed and notarized release gate.
          set -euo pipefail
          AUTOPUS_INSTALLER_TEST_SOURCE=1
          export AUTOPUS_INSTALLER_TEST_SOURCE
          . ./install.sh
          . ./scripts/install-runtime-v1.sh

          runtime_output_file="${RUNNER_TEMP}/auto-runtime-smoke.version.out"
          set +e
          run_version_smoke "$AUTOPUS_CI_RUNTIME_BINARY" "$runtime_output_file"
          runtime_status=$?
          set -e
          if [[ "$runtime_status" -ne 0 ]]; then
            runtime_output="$(cat "$runtime_output_file")"
            rm -f "$runtime_output_file"
            if [[ "$runtime_status" -eq 124 ]]; then
              echo "::error::Unsigned macOS runtime smoke timed out; the command and observed attached descendants were terminated"
            else
              echo "::error::Unsigned macOS runtime smoke failed with status ${runtime_status}: ${runtime_output}"
            fi
            exit 1
          fi
          if ! version_smoke_output_matches "$AUTOPUS_CI_RUNTIME_VERSION" "$runtime_output_file"; then
            runtime_output="$(cat "$runtime_output_file")"
            rm -f "$runtime_output_file"
            echo "::error::Runtime version output ${runtime_output} does not exactly match ${AUTOPUS_CI_RUNTIME_VERSION}"
            exit 1
          fi
          rm -f "$runtime_output_file"

      - name: Test macOS companion runtime contracts
        run: >-
          go test -race -count=1 -timeout=8m
          ./internal/companionmanifest/... ./pkg/companionmanifest/... ./pkg/selfupdate
          ./scripts/companion-release/execsmoke

      - name: Test macOS POSIX installer signing
        shell: bash
        run: |
          set -euo pipefail
          # A prefix -run filter is not a gate by itself: `go test` exits 0 with
          # "no tests to run" once every TestPOSIXInstaller* name is renamed away,
          # and it also exits 0 when a signing oracle skips. Require the declared
          # floor so a shrinking family cannot pass either, then require that the
          # tests reporting PASS are exactly the ones `go test -list` names for the
          # same filter. None of these tests call t.Skip today, so any skip is an
          # unproven gate and must fail (scripts/integration-oracles.sh in Autopus
          # is the same rule with an explicit allowed-skip argument).
          filter='^TestPOSIXInstaller'
          minimum=12
          log="$(mktemp)"
          listed="$(go test -list "$filter" . | awk '/^TestPOSIXInstaller/' | sort -u | tr '\n' ' ')"
          read -ra listed_tests <<<"$listed"
          if [[ "${#listed_tests[@]}" -lt "$minimum" ]]; then
            echo "::error::-run '${filter}' lists ${#listed_tests[@]} test(s) in the root package, below the declared ${minimum}: [${listed}]. Renamed installer signing tests would leave this gate vacuous"
            exit 1
          fi
          go test -count=1 -timeout=5m -v . -run "$filter" 2>&1 | tee "$log"
          observed="$(sed -n 's/^--- PASS: \([^ ]*\).*/\1/p' "$log" | sort -u | tr '\n' ' ')"
          if [[ "$observed" != "$listed" ]]; then
            echo "::error::-run '${filter}' listed [${listed}] but only [${observed}] reported PASS; the difference skipped or never ran"
            exit 1
          fi

  windows-runtime:
    name: windows-runtime
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test Windows self-update runtime contracts
        run: go test -count=1 -timeout=8m ./pkg/selfupdate

      - name: Test Windows process probe subtree cleanup
        shell: bash
        run: |
          set -euo pipefail
          # -count=3 multiplies the PASS lines, so compare the deduplicated names
          # against `go test -list` for the same filter instead of a raw count:
          # a renamed subtree-cleanup test would otherwise leave "no tests to run"
          # behind a green gate. The floor is declared so losing most of the
          # family fails even while one survivor still matches the prefix.
          filter='^TestOutputWindows'
          minimum=7
          log="$(mktemp)"
          listed="$(go test -list "$filter" ./pkg/processprobe | awk '/^TestOutputWindows/' | sort -u | tr '\n' ' ')"
          read -ra listed_tests <<<"$listed"
          if [[ "${#listed_tests[@]}" -lt "$minimum" ]]; then
            echo "::error::-run '${filter}' lists ${#listed_tests[@]} test(s) in ./pkg/processprobe, below the declared ${minimum}: [${listed}]"
            exit 1
          fi
          go test -count=3 -timeout=2m -v ./pkg/processprobe -run "$filter" 2>&1 | tee "$log"
          observed="$(sed -n 's/^--- PASS: \([^ ]*\).*/\1/p' "$log" | sort -u | tr '\n' ' ')"
          if [[ "$observed" != "$listed" ]]; then
            echo "::error::-run '${filter}' listed [${listed}] but only [${observed}] reported PASS; the difference skipped or never ran"
            exit 1
          fi

      - name: Test Windows self-update CLI failure boundaries
        shell: bash
        run: |
          set -euo pipefail
          # The alternation carries three `.*` branches, so a rename inside any of
          # them silently drops tests while `go test` still exits 0. Require the
          # declared floor, then require every listed test to report PASS or an
          # allowed SKIP. TestProbeStagedSelfUpdateVersion_UsesLiteralBinaryPath
          # skips on Windows by design (executable names cannot carry shell
          # metacharacters), so it is declared here the way
          # scripts/integration-oracles.sh in Autopus takes an allowed-skip
          # argument: every other skip still fails this gate.
          filter='^(TestResolveCurrentBinaryPath_FailsClosedWhenSymlinkEvalFails|TestWithSelfUpdateTempDir_DoesNotRunAfterCreateFailure|TestVerifyAndReplaceSelfUpdate_.*|TestProbeStagedSelfUpdateVersion_.*|TestNormalizeSelfUpdateVersionOutput_.*)$'
          minimum=8
          allowed_skip='TestProbeStagedSelfUpdateVersion_UsesLiteralBinaryPath'
          log="$(mktemp)"
          listed="$(go test -list "$filter" ./internal/cli | awk '/^Test/' | sort -u | tr '\n' ' ')"
          read -ra listed_tests <<<"$listed"
          if [[ "${#listed_tests[@]}" -lt "$minimum" ]]; then
            echo "::error::-run '${filter}' lists ${#listed_tests[@]} test(s) in ./internal/cli, below the declared ${minimum}: [${listed}]"
            exit 1
          fi
          go test -count=1 -timeout=5m -v ./internal/cli -run "$filter" 2>&1 | tee "$log"
          observed="$(sed -n -e 's/^--- PASS: \([^ ]*\).*/\1/p' \
            -e 's/^--- SKIP: \([^ ]*\).*/\1/p' "$log" | sort -u | tr '\n' ' ')"
          if [[ "$observed" != "$listed" ]]; then
            echo "::error::-run '${filter}' listed [${listed}] but observed [${observed}]; the difference never ran"
            exit 1
          fi
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            if [[ "$name" != "$allowed_skip" ]]; then
              echo "::error::${name} skipped outside the declared allow-list (${allowed_skip}); a skipped self-update failure boundary proves nothing"
              exit 1
            fi
          done < <(sed -n 's/^--- SKIP: \([^ ]*\).*/\1/p' "$log" | sort -u)

      - name: Test Windows installer signing on PowerShell 5.1
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/release-signing/tests/windows-installer-signing-test.ps1

      - name: Test Windows installer signing on PowerShell 7
        run: >-
          pwsh.exe -NoLogo -NoProfile -NonInteractive
          -File scripts/release-signing/tests/windows-installer-signing-test.ps1

  upgrade-canary:
    name: upgrade-canary-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build source candidate for compatibility proof
        shell: bash
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/auto-0.50.109-canary"
          go build -trimpath \
            -ldflags "-s -w -X github.com/insajin/autopus-adk/pkg/version.version=0.50.109-canary -X github.com/insajin/autopus-adk/pkg/version.commit=candidate-source -X github.com/insajin/autopus-adk/pkg/version.date=1970-01-01T00:00:00Z" \
            -o "$candidate" ./cmd/auto
          printf 'UPGRADE_CANARY_BINARY=%s\n' "$candidate" >> "$GITHUB_ENV"

      - name: Prove v0.50.108 fixture compatibility
        shell: bash
        env:
          UPGRADE_CANARY_RECEIPT_DIR: ${{ runner.temp }}/upgrade-canary-fixture-receipt
        run: |
          set -euo pipefail
          # This is candidate-source compatibility proof, not old/new release executable or signature proof.
          scripts/release-signing/tests/posix-upgrade-canary.sh \
            fixture "$UPGRADE_CANARY_BINARY"
