name: Release
on:
  push:
    tags:
      - 'v0.50.118'
permissions:
  contents: read
jobs:
  # Release gate: run the full CI suite on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yaml
  # Security gate: block release on a vulnerability or leaked secret.
  security:
    uses: ./.github/workflows/security.yml

  omp-production-evidence:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate-artifact-sha256: ${{ steps.candidate.outputs.candidate-artifact-sha256 }}
      static-policy-sha256: ${{ steps.candidate.outputs.static-policy-sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Validate exact R2-signed A29 source
        id: release-source
        shell: bash
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_REF_TYPE="$GITHUB_REF_TYPE" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" COMPANION_SOURCE_PIN_REQUIRED=0 \
            COMPANION_RELEASE_TAG_SIGNATURE_REQUIRED=1 \
            scripts/companion-release/validate-source.sh

      - name: Extract pinned orphan production evidence
        shell: bash
        env:
          OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA: ${{ vars.OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA }}
          OMP_CONTEXT_EVIDENCE_COMMIT_SHA: ${{ vars.OMP_CONTEXT_EVIDENCE_COMMIT_SHA }}
          OMP_CONTEXT_EVIDENCE_TREE_SHA: ${{ vars.OMP_CONTEXT_EVIDENCE_TREE_SHA }}
          OMP_CONTEXT_EVIDENCE_REPORT_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_REPORT_SHA256 }}
          OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256 }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA="$OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA" \
            OMP_CONTEXT_EVIDENCE_COMMIT_SHA="$OMP_CONTEXT_EVIDENCE_COMMIT_SHA" \
            OMP_CONTEXT_EVIDENCE_TREE_SHA="$OMP_CONTEXT_EVIDENCE_TREE_SHA" \
            OMP_CONTEXT_EVIDENCE_REPORT_SHA256="$OMP_CONTEXT_EVIDENCE_REPORT_SHA256" \
            OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256="$OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256" \
            scripts/companion-release/verify-omp-context-evidence-tag.sh \
            "$RUNNER_TEMP/omp-context-production-evidence"

      - name: Build trusted A29 evidence verifier
        shell: bash
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/auto-omp-context-evidence-verifier"
          [[ ! -e "$verifier" && ! -L "$verifier" ]]
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$verifier" \
            ./scripts/companion-release/ompcontextverify
          chmod 0700 "$verifier"

      - name: Build canonical policy-bearing production candidate
        id: candidate
        shell: bash
        env:
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          OMP_CONTEXT_STATIC_POLICY_B64: ${{ vars.OMP_CONTEXT_STATIC_POLICY_B64 }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/auto-darwin-arm64-production-candidate"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            COMPANION_RELEASE_TAG="$GITHUB_REF_NAME" GITHUB_SHA="$GITHUB_SHA" \
            COMPANION_SOURCE_TREE="$COMPANION_SOURCE_TREE" \
            OMP_CONTEXT_STATIC_POLICY_B64="$OMP_CONTEXT_STATIC_POLICY_B64" \
            scripts/companion-release/build-omp-context-candidate.sh "$candidate"
          candidate_sha=$(shasum -a 256 "$candidate" | awk '{print $1}')
          [[ "$candidate_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'candidate-artifact-sha256=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          static_policy_sha=$(printf '%s' "$OMP_CONTEXT_STATIC_POLICY_B64" |
            shasum -a 256 | awk '{print $1}')
          [[ "$static_policy_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'static-policy-sha256=%s\n' "$static_policy_sha" >> "$GITHUB_OUTPUT"

      - name: Verify fresh K3-signed production evidence
        shell: bash
        env:
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate.outputs.candidate-artifact-sha256 }}
          OMP_CONTEXT_EVIDENCE_REPORT_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_REPORT_SHA256 }}
          OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256 }}
          OMP_CONTEXT_STATIC_POLICY_B64: ${{ vars.OMP_CONTEXT_STATIC_POLICY_B64 }}
        run: |
          evidence="$RUNNER_TEMP/omp-context-production-evidence"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            "$RUNNER_TEMP/auto-omp-context-evidence-verifier" \
            --mode active \
            --report "$evidence/omp-context-promotion-report.v1.json" \
            --attestation "$evidence/omp-context-promotion-attestation.v2.json" \
            --report-sha256 "$OMP_CONTEXT_EVIDENCE_REPORT_SHA256" \
            --attestation-sha256 "$OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256" \
            --candidate-repository 'autopus-ai/autopus-adk' \
            --candidate-revision "$GITHUB_SHA" \
            --candidate-tree "$COMPANION_SOURCE_TREE" \
            --candidate-artifact-sha256 "$CANDIDATE_ARTIFACT_SHA256" \
            --static-policy-b64 "$OMP_CONTEXT_STATIC_POLICY_B64"

      - name: Carry verified evidence into the protected release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omp-context-evidence-v0.50.118
          path: |
            ${{ runner.temp }}/omp-context-production-evidence/omp-context-promotion-report.v1.json
            ${{ runner.temp }}/omp-context-production-evidence/omp-context-promotion-attestation.v2.json
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [ci, security, omp-production-evidence]
    if: github.ref == 'refs/tags/v0.50.118'
    environment:
      name: adk-companion-release
    permissions:
      contents: write
      id-token: write
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Select Homebrew OpenSSL 3
        shell: bash
        run: |
          set -euo pipefail
          openssl_prefix=$(brew --prefix openssl@3)
          [[ -n "$openssl_prefix" ]]
          openssl_bin="$openssl_prefix/bin"
          [[ -x "$openssl_bin/openssl" ]]
          openssl_version=$("$openssl_bin/openssl" version)
          [[ "$openssl_version" == "OpenSSL 3."* ]]
          printf '%s\n' "$openssl_bin" >> "$GITHUB_PATH"

      - name: Validate exact protected release source
        id: release-source
        shell: bash
        env:
          COMPANION_APPROVED_SOURCE_COMMIT: ${{ vars.ADK_COMPANION_APPROVED_SOURCE_COMMIT }}
          COMPANION_APPROVED_SOURCE_TREE: ${{ vars.ADK_COMPANION_APPROVED_SOURCE_TREE }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_REF_TYPE="$GITHUB_REF_TYPE" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" COMPANION_SOURCE_PIN_REQUIRED=1 \
            COMPANION_RELEASE_TAG_SIGNATURE_REQUIRED=1 \
            COMPANION_APPROVED_SOURCE_COMMIT="$COMPANION_APPROVED_SOURCE_COMMIT" \
            COMPANION_APPROVED_SOURCE_TREE="$COMPANION_APPROVED_SOURCE_TREE" \
            scripts/companion-release/validate-source.sh

      - name: Verify exact sealed release-tag authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" GITHUB_TOKEN="$GITHUB_TOKEN" \
            scripts/companion-release/verify-release-tag-ruleset.sh --sealed-runtime

      - name: Verify operator-owned empty draft release reservation
        id: release-reservation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA: ${{ vars.OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA }}
          OMP_CONTEXT_EVIDENCE_COMMIT_SHA: ${{ vars.OMP_CONTEXT_EVIDENCE_COMMIT_SHA }}
          OMP_CONTEXT_EVIDENCE_TREE_SHA: ${{ vars.OMP_CONTEXT_EVIDENCE_TREE_SHA }}
          OMP_CONTEXT_EVIDENCE_REPORT_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_REPORT_SHA256 }}
          OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256 }}
          OMP_CONTEXT_STATIC_POLICY_B64: ${{ vars.OMP_CONTEXT_STATIC_POLICY_B64 }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate --slurp \
            'repos/autopus-ai/autopus-adk/releases?per_page=100')
          reservation=$(jq -ce \
            '[.[][]] as $all |
             [$all[] | select(.tag_name == "v0.50.118")] as $tagged |
             [$all[] | select(.draft == true and .name == "v0.50.118")] as $named |
             if ($tagged | length) == 1 and ($named | length) == 1 and
                $tagged[0].id == $named[0].id
             then $tagged[0]
             else error("release reservation is missing, duplicated, or name-colliding")
             end' <<<"$releases")
          static_policy_sha=$(printf '%s' "$OMP_CONTEXT_STATIC_POLICY_B64" |
            shasum -a 256 | awk '{print $1}')
          jq -e --arg source "$GITHUB_SHA" --arg tree "$COMPANION_SOURCE_TREE" \
            --arg evidence_tag_object "$OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA" \
            --arg evidence_commit "$OMP_CONTEXT_EVIDENCE_COMMIT_SHA" \
            --arg evidence_tree "$OMP_CONTEXT_EVIDENCE_TREE_SHA" \
            --arg report_sha256 "$OMP_CONTEXT_EVIDENCE_REPORT_SHA256" \
            --arg attestation_sha256 "$OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256" \
            --arg static_policy_sha256 "$static_policy_sha" \
            '.id | type == "number"' <<<"$reservation" >/dev/null
          jq -e --arg source "$GITHUB_SHA" --arg tree "$COMPANION_SOURCE_TREE" \
            --arg evidence_tag_object "$OMP_CONTEXT_EVIDENCE_TAG_OBJECT_SHA" \
            --arg evidence_commit "$OMP_CONTEXT_EVIDENCE_COMMIT_SHA" \
            --arg evidence_tree "$OMP_CONTEXT_EVIDENCE_TREE_SHA" \
            --arg report_sha256 "$OMP_CONTEXT_EVIDENCE_REPORT_SHA256" \
            --arg attestation_sha256 "$OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256" \
            --arg static_policy_sha256 "$static_policy_sha" \
            '.draft == true and .prerelease == false and .author.id == 204883817 and
             .target_commitish == $source and .name == "v0.50.118" and
             (.assets | type == "array" and length == 0) and
             ((.body | fromjson) == {
               schema_version:"autopus.adk_release_reservation.v1",
               release_tag:"v0.50.118",
               source_commit:$source,
               source_tree:$tree,
               evidence_tag_object:$evidence_tag_object,
               evidence_commit:$evidence_commit,
               evidence_tree:$evidence_tree,
               report_sha256:$report_sha256,
               attestation_sha256:$attestation_sha256,
               static_policy_sha256:$static_policy_sha256
             })' <<<"$reservation" >/dev/null
          release_id=$(jq -r '.id' <<<"$reservation")
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          printf 'release-id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"

      - name: Verify Darwin release execution support
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Darwin' ]]
          [[ "$(uname -m)" == 'arm64' ]]
          /usr/bin/arch -arm64 /usr/bin/true
          /usr/bin/arch -x86_64 /usr/bin/true
          /usr/bin/sudo -n -u nobody /usr/bin/true

      - name: Materialize exact arm64 OMP release canary
        shell: bash
        run: scripts/companion-release/materialize-omp-release-canary.sh

      - name: Verify tidy source without mutation
        shell: bash
        run: go mod tidy -diff

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "v2.17.0"
          install-only: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Build companion release verification tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signer="$RUNNER_TEMP/auto-companion-manifest-signer"
          verifier="$RUNNER_TEMP/auto-companion-receipt-verifier"
          manifest_verifier="$RUNNER_TEMP/auto-companion-manifest-verifier"
          exec_smoke_gate="$RUNNER_TEMP/auto-companion-exec-smoke-gate"
          omp_evidence_verifier="$RUNNER_TEMP/auto-omp-context-evidence-verifier"
          omp_lineage_verifier="$RUNNER_TEMP/auto-omp-context-lineage-verifier"
          [[ ! -e "$signer" && ! -L "$signer" &&
             ! -e "$verifier" && ! -L "$verifier" &&
             ! -e "$manifest_verifier" && ! -L "$manifest_verifier" &&
             ! -e "$exec_smoke_gate" && ! -L "$exec_smoke_gate" &&
             ! -e "$omp_evidence_verifier" && ! -L "$omp_evidence_verifier" &&
             ! -e "$omp_lineage_verifier" && ! -L "$omp_lineage_verifier" ]]
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$signer" ./cmd/auto
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$verifier" \
            ./internal/companionmanifest/receiptverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$manifest_verifier" \
            ./scripts/companion-release/manifestverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$exec_smoke_gate" \
            ./scripts/companion-release/execsmoke
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$omp_evidence_verifier" \
            ./scripts/companion-release/ompcontextverify
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            go build -trimpath -o "$omp_lineage_verifier" \
            ./scripts/companion-release/ompcontextlineageverify
          chmod 0700 "$signer" "$verifier" "$manifest_verifier" \
            "$exec_smoke_gate" "$omp_evidence_verifier" "$omp_lineage_verifier"

      - name: Download same-run production evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: omp-context-evidence-v0.50.118
          path: ${{ runner.temp }}/omp-context-production-evidence

      - name: Reverify active K3 production evidence inside protected environment
        shell: bash
        env:
          COMPANION_SOURCE_TREE: ${{ steps.release-source.outputs.source-tree }}
          CANDIDATE_ARTIFACT_SHA256: ${{ needs.omp-production-evidence.outputs.candidate-artifact-sha256 }}
          OMP_CONTEXT_EVIDENCE_REPORT_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_REPORT_SHA256 }}
          OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256 }}
          OMP_CONTEXT_STATIC_POLICY_B64: ${{ vars.OMP_CONTEXT_STATIC_POLICY_B64 }}
          OMP_CONTEXT_STATIC_POLICY_SHA256: ${{ needs.omp-production-evidence.outputs.static-policy-sha256 }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/omp-context-production-evidence"
          chmod 0600 "$evidence/omp-context-promotion-report.v1.json" \
            "$evidence/omp-context-promotion-attestation.v2.json"
          [[ "$(printf '%s' "$OMP_CONTEXT_STATIC_POLICY_B64" |
            shasum -a 256 | awk '{print $1}')" == "$OMP_CONTEXT_STATIC_POLICY_SHA256" ]]
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            "$RUNNER_TEMP/auto-omp-context-evidence-verifier" \
            --mode active \
            --report "$evidence/omp-context-promotion-report.v1.json" \
            --attestation "$evidence/omp-context-promotion-attestation.v2.json" \
            --report-sha256 "$OMP_CONTEXT_EVIDENCE_REPORT_SHA256" \
            --attestation-sha256 "$OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256" \
            --candidate-repository 'autopus-ai/autopus-adk' \
            --candidate-revision "$GITHUB_SHA" \
            --candidate-tree "$COMPANION_SOURCE_TREE" \
            --candidate-artifact-sha256 "$CANDIDATE_ARTIFACT_SHA256" \
            --static-policy-b64 "$OMP_CONTEXT_STATIC_POLICY_B64"

      # GoReleaser extra_files must be repository-relative.
      - name: Stage verified production evidence for release assets
        shell: bash
        env:
          OMP_CONTEXT_EVIDENCE_REPORT_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_REPORT_SHA256 }}
          OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256: ${{ vars.OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/omp-context-production-evidence"
          staged='.autopus/runtime/release-evidence'
          rm -rf -- "$staged"
          install -d -m 0700 "$staged"
          install -m 0600 "$evidence/omp-context-promotion-report.v1.json" \
            "$staged/omp-context-promotion-report.v1.json"
          install -m 0600 "$evidence/omp-context-promotion-attestation.v2.json" \
            "$staged/omp-context-promotion-attestation.v2.json"
          [[ "$(shasum -a 256 "$staged/omp-context-promotion-report.v1.json" |
            awk '{print $1}')" == "$OMP_CONTEXT_EVIDENCE_REPORT_SHA256" ]] ||
            { echo '::error::staged promotion report digest differs'; exit 1; }
          [[ "$(shasum -a 256 "$staged/omp-context-promotion-attestation.v2.json" |
            awk '{print $1}')" == "$OMP_CONTEXT_EVIDENCE_ATTESTATION_SHA256" ]] ||
            { echo '::error::staged promotion attestation digest differs'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] ||
            { echo '::error::staging evidence dirtied the release worktree'; exit 1; }
      - name: Prepare release credentials
        id: release-credentials
        shell: bash
        env:
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ADK_COMPANION_ED25519_PRIVATE_KEY: ${{ secrets.ADK_COMPANION_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for name in \
            APPLE_API_ISSUER_SECRET APPLE_API_KEY_SECRET APPLE_API_KEY_P8 \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            ADK_COMPANION_ED25519_PRIVATE_KEY
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::required release credential ${name} is not configured"
              exit 1
            fi
          done
          if [[ ! "$APPLE_API_KEY_SECRET" =~ ^[A-Za-z0-9]{1,64}$ ]] || \
             [[ ! "$APPLE_API_ISSUER_SECRET" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo '::error::Apple API key metadata is invalid'
            exit 1
          fi
          credential_dir="$RUNNER_TEMP/adk-release-credentials"
          [[ ! -e "$credential_dir" && ! -L "$credential_dir" ]]
          install -m 0700 -d "$credential_dir"
          api_key_path="$credential_dir/AuthKey_${APPLE_API_KEY_SECRET}.p8"
          certificate_path="$credential_dir/developer-id.p12"
          companion_key_path="$credential_dir/companion-ed25519-private-key"
          keychain_path="$RUNNER_TEMP/adk-release.keychain-db"
          keychain_password_file="$credential_dir/keychain-password"
          [[ ! -e "$keychain_path" && ! -L "$keychain_path" ]]
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$ADK_COMPANION_ED25519_PRIVATE_KEY" > "$companion_key_path"
          /usr/bin/openssl rand -hex 32 > "$keychain_password_file"
          chmod 0600 \
            "$api_key_path" "$certificate_path" "$companion_key_path" \
            "$keychain_password_file"
          keychain_password=$(<"$keychain_password_file")
          security create-keychain -p "$keychain_password" "$keychain_path" >/dev/null
          chmod 0600 "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F'"' '/Developer ID Application:/ && /\(GP2PFA2PUV\)/ { print $2 }')
          if [[ -z "$identity" || "$identity" == *$'\n'* ]]; then
            echo '::error::exactly one GP2PFA2PUV Developer ID Application identity is required'
            exit 1
          fi
          rm -f -- "$certificate_path"
          printf 'apple-signing-identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Materialize release signing key
        shell: bash
        env:
          ADK_RELEASE_ECDSA_PRIVATE_KEY: ${{ secrets.ADK_RELEASE_ECDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$ADK_RELEASE_ECDSA_PRIVATE_KEY" ]]
          credential_dir="$RUNNER_TEMP/adk-release-credentials"
          [[ -d "$credential_dir" && ! -L "$credential_dir" ]]
          release_signing_key_path="$credential_dir/release-ecdsa-private-key"
          [[ ! -e "$release_signing_key_path" && ! -L "$release_signing_key_path" ]]
          printf '%s' "$ADK_RELEASE_ECDSA_PRIVATE_KEY" > "$release_signing_key_path"
          chmod 0600 "$release_signing_key_path"

      - name: Verify release signing key pair
        shell: bash
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            scripts/release-signing/verify-key-pair.sh \
            "$RUNNER_TEMP/adk-release-credentials/release-ecdsa-private-key" \
            scripts/release-signing/release-k1-public.pem \
            scripts/release-signing/release-k1.fingerprint

      - name: Verify release nobody privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(/usr/bin/id -u)
          nobody_uid=$(/usr/bin/id -u nobody)
          [[ "$runner_uid" =~ ^[0-9]+$ && "$nobody_uid" =~ ^[0-9]+$ ]]
          [[ "$runner_uid" != "$nobody_uid" ]]
          isolated_uid=$(/usr/bin/sudo -n -u nobody /usr/bin/env -i \
            PATH=/usr/bin:/bin /usr/bin/id -u)
          [[ "$isolated_uid" == "$nobody_uid" ]]
          credential_dir="$RUNNER_TEMP/adk-release-credentials"
          sentinel="$credential_dir/nobody-boundary-sentinel"
          keychain="$RUNNER_TEMP/adk-release.keychain-db"
          helper="$RUNNER_TEMP/auto-companion-exec-smoke-gate"
          [[ -d "$credential_dir" && ! -L "$credential_dir" ]]
          [[ "$(/usr/bin/stat -f '%u:%Lp' "$credential_dir")" == "$runner_uid:700" ]]
          [[ ! -e "$sentinel" && ! -L "$sentinel" ]]
          /usr/bin/printf 'release privilege boundary probe\n' > "$sentinel"
          /bin/chmod 0600 "$sentinel"
          api_key_paths=("$credential_dir"/AuthKey_*.p8)
          [[ "${#api_key_paths[@]}" -eq 1 && -f "${api_key_paths[0]}" && ! -L "${api_key_paths[0]}" ]]
          protected_paths=("$sentinel" "${api_key_paths[0]}" \
            "$credential_dir/companion-ed25519-private-key" \
            "$credential_dir/release-ecdsa-private-key" \
            "$credential_dir/keychain-password" "$keychain" "$helper")
          protected_modes=(600 600 600 600 600 600 700)
          for index in "${!protected_paths[@]}"; do
            protected_path="${protected_paths[$index]}"
            expected_mode="${protected_modes[$index]}"
            [[ -f "$protected_path" && ! -L "$protected_path" ]]
            [[ "$(/usr/bin/stat -f '%u:%Lp' "$protected_path")" == "$runner_uid:$expected_mode" ]]
            for permission in -r -w -x; do
              if /usr/bin/sudo -n -u nobody /usr/bin/env -i PATH=/usr/bin:/bin \
                /bin/test "$permission" "$protected_path"; then
                echo "::error::nobody unexpectedly has $permission access to protected release state"
                exit 1
              fi
            done
          done
          if /usr/bin/sudo -n -u nobody /usr/bin/env -i PATH=/usr/bin:/bin \
            /usr/bin/sudo -n -u root /usr/bin/true >/dev/null 2>&1; then
            echo '::error::nobody unexpectedly regained root through sudo'
            exit 1
          fi

